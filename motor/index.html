<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Motor de Imaginación</title>
<style>body{margin:0;background:#0f1310;color:#EDEAE0;font-family:Georgia,serif}</style>
</head>
<body>
<div class="wrap">
  <h1>Motor de Imaginación</h1>
  <p>Cargando...</p>
</div>
</body>
</html>
    </div>

    <div class="btnRow">
      <button id="playBtn" class="primary">⏸ Pausar</button>
      <button id="stepBtn">⏭ Paso</button>
      <button id="newBtn">⟳ Nuevo sueño</button>
      <button id="copyBtn">📋 Copiar seeds</button>
      <button id="restoreBtn" class="amber">📥 Restaurar</button>
    </div>
    <div class="seedRow mono" id="seedRow"></div>
  </div>

  <p class="foot sans">El <b>tono</b> de cada píxel codifica <b>qué memoria</b> domina ahí (correlación local rectificada, como un mapa de dominancia cortical); el <b>brillo</b> codifica <b>cuánto</b> domina (energía local).</p>

  <p class="persistNote mono" id="persistNote">estado no guardado aún</p>

  <!-- ===== GALERÍA AVANZADA ===== -->
  <section class="gallery-section" id="gallery-section">
    <div class="gallery-header">
      <h2 class="gallery-title">Galería de Sueños</h2>
      <span id="gallery-count" class="mono" style="color:var(--chalkDim); font-size:12px;">0 sueños</span>
    </div>
    
    <div class="palette-selector" id="palette-selector">
      <button class="palette-btn active" data-set="neon">Neon</button>
      <button class="palette-btn" data-set="viridis">Viridis</button>
      <button class="palette-btn" data-set="plasma">Plasma</button>
      <button class="palette-btn" data-set="inferno">Inferno</button>
      <button class="palette-btn" data-set="magma">Magma</button>
      <button class="palette-btn" data-set="cividis">Cividis</button>
      <button class="palette-btn" data-set="twilight">Twilight</button>
    </div>
    
    <div class="filter-bar" id="palette-filters"></div>
    
    <div class="controls-row">
      <input type="text" class="search-box" id="search-box" placeholder="Buscar por nombre o seed..." />
      <button class="sort-btn" data-sort="seed" data-label="Seed">Seed ↓</button>
      <button class="sort-btn" data-sort="entropy_shannon" data-label="Shannon">Shannon</button>
      <button class="sort-btn" data-sort="entropy_spatial" data-label="Espacial">Espacial</button>
      <button class="sort-btn" data-sort="filename" data-label="Archivo">Archivo</button>
    </div>
    
    <div class="range-inputs">
      <label>Shannon: <input type="number" id="shannon-min" step="0.01" placeholder="min"><input type="number" id="shannon-max" step="0.01" placeholder="max"></label>
      <label>Espacial: <input type="number" id="spatial-min" step="0.01" placeholder="min"><input type="number" id="spatial-max" step="0.01" placeholder="max"></label>
      <label>Seed: <input type="number" id="seed-min" placeholder="min"><input type="number" id="seed-max" placeholder="max"></label>
      <button id="clear-filters" style="padding:4px 10px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:var(--chalk); cursor:pointer; font-size:11px;">Limpiar</button>
    </div>
    
    <div id="status" class="status">⟳ Cargando manifiesto neural...</div>
    <div id="gallery"></div>
  </section>

  <!-- Modal para vista ampliada -->
  <div id="modal">
    <canvas id="modal-canvas"></canvas>
    <p id="modal-caption"></p>
    <button id="modal-close" aria-label="Cerrar">✕</button>
  </div>
</div>

<script type="module">
  import './cppn-engine.js';
</script>
<script type="module">
  import './dream-loader.v2.js';
</script>
</body>
</html>

name: CodeQL Analysis
on:
  push:
    branches: [main, master, blist-v11-clean]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
jobs:
  availability:
    runs-on: ubuntu-latest
    steps:
      - name: Explain analysis availability
        env:
          PRIVATE: ${{ github.event.repository.private }}
          ENABLED: ${{ vars.ENABLE_PRIVATE_3ea06614dafe36dec890db3446326e0d40ce53d4 }}
        run: |
          if [ "$PRIVATE" = "true" ] && [ "$ENABLED" != "true" ]; then
            echo "CodeQL skipped: private repository requires code scanning entitlement. Bandit and tests remain enabled." >> "$GITHUB_STEP_SUMMARY"
          fi
  analyze:
    name: Analyze (${{ matrix.language }})
    if: ${{ !github.event.repository.private || vars.ENABLE_PRIVATE_3ea06614dafe36dec890db3446326e0d40ce53d4 == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with:
          category: /language:${{ matrix.language }}

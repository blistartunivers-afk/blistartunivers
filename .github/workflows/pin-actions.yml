# Validate immutable action references without modifying repository branches.
name: "Pin Actions"
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  pin-actions:
    name: Pin Actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check immutable GitHub Actions references
        uses: suzuki-shunsuke/pinact-action@b1a1f46bb10f2908950d95f626ca8cc109e2cf7d # v3.1.0
        with:
          fix: "false"
          skip_push: "true"
          no_api: "true"

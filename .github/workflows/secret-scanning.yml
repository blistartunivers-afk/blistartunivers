name: Secret Scanning
on:
  push:
    branches: [main, master, blist-v11-clean]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanner
        run: |
          curl --fail --silent --show-error --location --max-time 120 https://github.com/trufflesecurity/trufflehog/releases/download/v3.100.1/trufflehog_3.100.1_linux_amd64.tar.gz --output "$RUNNER_TEMP/trufflehog.tar.gz"
          echo "b2460688116f29ce33f1afe16d14fef3fa3db928e74ba55a6c9fed392c60ad69  $RUNNER_TEMP/trufflehog.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trufflehog.tar.gz" -C "$RUNNER_TEMP" trufflehog
      - name: Scan history without disclosing raw credentials
        run: |
          status=0
          "$RUNNER_TEMP/trufflehog" git "file://$GITHUB_WORKSPACE" --json --no-verification --fail > "$RUNNER_TEMP/secret-results.jsonl" || status=$?
          python3 scripts/summarize_secrets.py "$RUNNER_TEMP/secret-results.jsonl"
          exit "$status"
